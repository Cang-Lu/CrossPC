[build-system]
# Pure standard-library project: setuptools is only used so the package can be
# pip-installed; nothing is needed at runtime
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crosspc"
version = "0.1.0"
description = "Share one mouse and keyboard across a LAN (Windows server + Debian client)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
#: zero runtime dependencies -- really not a single third-party package
dependencies = []
keywords = ["kvm", "synergy", "barrier", "clipboard", "lan", "remote-input"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.scripts]
crosspc = "crosspc.cli:main"

[tool.setuptools]
packages = ["crosspc", "crosspc.backend"]
