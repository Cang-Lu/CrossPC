name: CI

# Why CI matters especially for this project:
#   the development machine is Windows, so the Linux path (X11/uinput injection,
#   the xclip clipboard, Debian's install_linux.sh) cannot run locally at all.
#   crosspc selftest uses the **fake backend** and needs no real X11/uinput, so
#   it can run the whole main line -- "server + client + protocol + routing +
#   clipboard" -- on a real Linux kernel. That is the coverage this machine
#   cannot provide.
#   The two real keyboard/mouse items (capturetest/injecttest) deliberately do
#   not run in CI: a CI machine has no interactive desktop, so they would always
#   fail, and that is an environment limitation rather than a code problem.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel older still-running jobs when commits are pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Test Python ${{ matrix.python }} @ ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 has no prebuilt packages on ubuntu-latest (24.04), so use 22.04
          - { os: ubuntu-22.04, python: "3.8" }
          # Debian 12 ships 3.11, so pin that one separately
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    env:
      # The Windows runner's default console encoding is not UTF-8 and the test
      # names contain non-ASCII characters, so without this a UnicodeEncodeError
      # would be reported as a test failure
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Environment info
        run: |
          python -VV
          python -c "import sys, platform; print(sys.executable); print(platform.platform())"

      - name: Syntax check
        run: python -m compileall -q crosspc tests tools

      - name: Unit/integration tests (no keyboard or mouse, no second machine)
        run: python -m unittest discover -s tests -t . -v

      - name: End-to-end loopback self-test (real protocol/real network/position math/clipboard)
        run: python -m crosspc selftest

      - name: Environment self-check (read-only, will not take over the keyboard and mouse)
        # Headless CI has no X11/uinput, so this step is informational only; a failure does not block
        continue-on-error: true
        run: python -m crosspc doctor

      - name: GUI tests (use xvfb to create a virtual display on Ubuntu)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb || true
          xvfb-run -a python -m unittest tests.test_gui -v

  package:
    name: Build and install verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install . (verify pyproject is correct)
        run: |
          python -m pip install --upgrade pip
          pip install .
          crosspc --version
          crosspc --help > /dev/null

      - name: Build the release package
        run: python tools/make_release.py

      - name: Confirm the release package has no private files or caches
        run: |
          python - <<'PY'
          import zipfile, sys
          bad = []
          with zipfile.ZipFile("dist/crosspc-0.1.0.zip") as z:
              names = z.namelist()
              for n in names:
                  if n.endswith((".pyc", ".pyo")) or "__pycache__" in n:
                      bad.append(n)
                  if n.rsplit("/", 1)[-1] in ("crosspc.json", "crosspc.cache.json"):
                      bad.append(n)
              print("files in archive:", len(names))
          if bad:
              print("unexpected files:", bad)
              sys.exit(1)
          print("OK: no caches/private config")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crosspc-release-zip
          path: dist/*.zip
          if-no-files-found: error
