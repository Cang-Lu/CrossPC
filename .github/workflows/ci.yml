name: CI

# 为什么 CI 对这个项目特别重要:
#   开发机是 Windows, Linux 那条路(X11/uinput 注入、xclip 剪辑板、Debian 的
#   install_linux.sh)在本机根本跑不起来。而 crosspc selftest 用的是**假后端**,
#   不需要真实 X11/uinput, 所以它能在一个真 Linux 内核上把"服务端 + 客户端 +
#   协议 + 路由 + 剪辑板"这条主线完整跑通 —— 这是本机验证不了的补位。
#   真键鼠相关的两项(capturetest/injecttest)故意不在 CI 里跑: CI 机器没有
#   交互桌面, 跑了必然失败, 那是环境限制而不是代码问题。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支上连续推送时, 取消还没跑完的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "测试 Python ${{ matrix.python }} @ ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 在 ubuntu-latest(24.04) 上没有预编译包, 用 22.04
          - { os: ubuntu-22.04, python: "3.8" }
          # Debian 12 自带的就是 3.11, 单独钉一个
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    env:
      # Windows runner 默认控制台编码不是 UTF-8, 而测试名里有中文,
      # 不设这个会把 UnicodeEncodeError 当成测试失败
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 环境信息
        run: |
          python -VV
          python -c "import sys, platform; print(sys.executable); print(platform.platform())"

      - name: 语法检查
        run: python -m compileall -q crosspc tests tools

      - name: 单元/集成测试(不需要键鼠, 不需要第二台机器)
        run: python -m unittest discover -s tests -t . -v

      - name: 端到端回环自测(真协议/真网络/位置计算/剪辑板)
        run: python -m crosspc selftest

      - name: 环境自检(只读, 不会接管键鼠)
        # 无头 CI 上没有 X11/uinput, 这一项只当信息收集, 失败不拦
        continue-on-error: true
        run: python -m crosspc doctor

      - name: 图形界面测试(Ubuntu 上用 xvfb 造一个虚拟显示)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb || true
          xvfb-run -a python -m unittest tests.test_gui -v

  package:
    name: 打包与安装验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install .(验证 pyproject 是对的)
        run: |
          python -m pip install --upgrade pip
          pip install .
          crosspc --version
          crosspc --help > /dev/null

      - name: 打发行包
        run: python tools/make_release.py

      - name: 确认发行包里没有私有文件或缓存
        run: |
          python - <<'PY'
          import zipfile, sys
          bad = []
          with zipfile.ZipFile("dist/crosspc-0.1.0.zip") as z:
              names = z.namelist()
              for n in names:
                  if n.endswith((".pyc", ".pyo")) or "__pycache__" in n:
                      bad.append(n)
                  if n.rsplit("/", 1)[-1] in ("crosspc.json", "crosspc.cache.json"):
                      bad.append(n)
              print("包内文件数:", len(names))
          if bad:
              print("不该出现的文件:", bad)
              sys.exit(1)
          print("OK: 没有缓存/私有配置")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crosspc-release-zip
          path: dist/*.zip
          if-no-files-found: error
